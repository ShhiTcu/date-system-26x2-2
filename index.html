<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>364a1Z7+2式日付</title>
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
    <script src="time.js" defer></script>
</head>

<body>

    <h1>26*2*7+2</h1>

    <label for="dateInput">日付：</label>
    <input type="date" id="dateInput">

    <p>変換結果：<span id="result"></span></p>

    <label for="codeInput">記号：</label>
    <input type="text" id="codeInput">

    <p>逆変換結果：<span id="dateResult"></span></p>

    <h2>時刻</h2>

    <div id="timeDial">
        <div id="upperDial"></div>
        <div id="lowerDial"></div>
    </div>

    <p>時間記号：<span id="timeResult"></span></p>
    <p>時刻：<span id="clockResult"></span></p>

    <label>
        時刻：
        <input type="time" id="timeInput">
    </label>

</body>
</html>
